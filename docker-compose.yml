# BlackNOOK Marketplace + Coder v2 geliştirici ortamları
#
# Uygulama: http://127.0.0.1:18080
# Coder UI/API: http://127.0.0.1:7080
#
# PostgreSQL (marketplace) Coolify/harici olabilir; Coder kendi coder-db'sini kullanır.
#
# Coolify: app ile Postgres aynı Docker network'te olmalı.
# DB_HOST = Coolify Postgres internal hostname

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://blacknook.com}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_GOOGLE_OAUTH: ${NEXT_PUBLIC_GOOGLE_OAUTH:-}
        NEXT_PUBLIC_CODER_URL: ${NEXT_PUBLIC_CODER_URL:-http://127.0.0.1:7080}
        NEXT_PUBLIC_CODER_FEATURE_ENABLED: ${NEXT_PUBLIC_CODER_FEATURE_ENABLED:-false}
        NEXT_PUBLIC_AGENT_STUDIO_ENABLED: ${NEXT_PUBLIC_AGENT_STUDIO_ENABLED:-true}
        NEXT_PUBLIC_ENABLE_DEV_AUTO_LOGIN: ${NEXT_PUBLIC_ENABLE_DEV_AUTO_LOGIN:-false}
        NEXT_PUBLIC_ENABLE_GOOGLE_OAUTH: ${NEXT_PUBLIC_ENABLE_GOOGLE_OAUTH:-true}
        NEXT_PUBLIC_ENABLE_GOOGLE_OAUTH_BYPASS: ${NEXT_PUBLIC_ENABLE_GOOGLE_OAUTH_BYPASS:-true}
        NEXT_PUBLIC_OTONOM_APP_URL: ${NEXT_PUBLIC_OTONOM_APP_URL:-https://agent.blacknook.com}
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-postgres}
      DB_SSL: ${DB_SSL:-false}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://blacknook.com}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://blacknook.com}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXT_PUBLIC_GOOGLE_OAUTH: ${NEXT_PUBLIC_GOOGLE_OAUTH:-}
      NEXT_PUBLIC_SPLINE_URL: ${NEXT_PUBLIC_SPLINE_URL:-}
      INSTALLATION_REQUEST_TO: ${INSTALLATION_REQUEST_TO:-dev@blacknook.com}
      MATCH_REQUEST_TO: ${MATCH_REQUEST_TO:-contact@blacknook.com}
      SUPPORT_DEMO_MODE: ${SUPPORT_DEMO_MODE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_SUPPORT_MODEL: ${OPENAI_SUPPORT_MODEL:-gpt-4o-mini}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID:-}
      RUNPOD_API_STYLE: ${RUNPOD_API_STYLE:-openai}
      RUNPOD_MODEL: ${RUNPOD_MODEL:-}
      RUNPOD_TIMEOUT_MS: ${RUNPOD_TIMEOUT_MS:-900000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-BlackNOOK <noreply@blacknook.com>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@blacknook.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-BlacknookAdmin1}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      UPLOAD_DIR: /app/uploads
      # Coder v2 — sunucu tarafı API (compose DNS). Host’taki CODER_URL=127.0.0.1
      # shell env’i .env’i ezer; bu yüzden ayrı INTERNAL değişkeni kullanıyoruz.
      CODER_URL: ${CODER_INTERNAL_URL:-http://coder:7080}
      CODER_API_TOKEN: ${CODER_API_TOKEN:-}
      CODER_TEMPLATE_ID: ${CODER_TEMPLATE_ID:-}
      NEXT_PUBLIC_CODER_URL: ${NEXT_PUBLIC_CODER_URL:-http://127.0.0.1:7080}
      NEXT_PUBLIC_CODER_FEATURE_ENABLED: ${NEXT_PUBLIC_CODER_FEATURE_ENABLED:-false}
      NEXT_PUBLIC_AGENT_STUDIO_ENABLED: ${NEXT_PUBLIC_AGENT_STUDIO_ENABLED:-true}
      ENABLE_DEV_AUTO_LOGIN: ${ENABLE_DEV_AUTO_LOGIN:-false}
      NEXT_PUBLIC_ENABLE_DEV_AUTO_LOGIN: ${NEXT_PUBLIC_ENABLE_DEV_AUTO_LOGIN:-false}
      ENABLE_GOOGLE_OAUTH: ${ENABLE_GOOGLE_OAUTH:-true}
      NEXT_PUBLIC_ENABLE_GOOGLE_OAUTH: ${NEXT_PUBLIC_ENABLE_GOOGLE_OAUTH:-true}
      ENABLE_GOOGLE_OAUTH_BYPASS: ${ENABLE_GOOGLE_OAUTH_BYPASS:-true}
      NEXT_PUBLIC_ENABLE_GOOGLE_OAUTH_BYPASS: ${NEXT_PUBLIC_ENABLE_GOOGLE_OAUTH_BYPASS:-true}
      DEV_AUTO_LOGIN_EMAIL: ${DEV_AUTO_LOGIN_EMAIL:-demo@blacknook.com}
      PITCH_DECK_PASSWORD: ${PITCH_DECK_PASSWORD:-}
      NEXT_PUBLIC_OTONOM_APP_URL: ${NEXT_PUBLIC_OTONOM_APP_URL:-https://agent.blacknook.com}
    ports:
      - '127.0.0.1:${APP_PORT:-18080}:3000'
    volumes:
      - blacknook_marketplace_uploads:/app/uploads
      # Studio: üretilen dosyaları Coder workspace konteynerine yazmak için
      - /var/run/docker.sock:/var/run/docker.sock
    # Docker Desktop VM sock root:root 660
    group_add:
      - '0'
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Coder v2 — varsayılan kapalı. Açmak: docker compose --profile coder up -d
  coder:
    profiles: ['coder']
    image: ghcr.io/coder/coder:latest
    restart: unless-stopped
    ports:
      - '7080:7080'
    environment:
      CODER_PG_CONNECTION_URL: >-
        postgresql://${CODER_PG_USER:-coder}:${CODER_PG_PASSWORD:-coderpass}@coder-db/${CODER_PG_DB:-coder}?sslmode=disable
      CODER_HTTP_ADDRESS: '0.0.0.0:7080'
      # Tarayıcı + workspace agent erişimi. Yerelde LAN IP tercih edilir; Docker şablonu
      # localhost'u host.docker.internal ile değiştirir.
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:-http://127.0.0.1:7080}
      CODER_TELEMETRY_ENABLE: 'false'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coder_home:/home/coder
    # Docker Desktop VM içinde sock root:root 660; coder kullanıcısına root grubu gerekir.
    # Linux host'ta genelde docker grubu GID'si (örn. 999) yeterli olur.
    group_add:
      - '0'
    depends_on:
      coder-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:7080/api/v2/buildinfo']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  coder-db:
    profiles: ['coder']
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CODER_PG_USER:-coder}
      POSTGRES_PASSWORD: ${CODER_PG_PASSWORD:-coderpass}
      POSTGRES_DB: ${CODER_PG_DB:-coder}
    volumes:
      - coder_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  blacknook_marketplace_uploads:
  coder_home:
  coder_db_data:
